services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: ledger, POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 20
      start_period: 30s
    depends_on:
      jaeger: {condition: service_started}
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on:
      app: {condition: service_healthy}
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
